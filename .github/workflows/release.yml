name: Publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development tools
        run: python -m pip install ".[dev]"
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version
          import xpushstream

          expected = os.environ["GITHUB_REF_NAME"]
          if expected != f"v{version('xpushstream')}" or expected != f"v{xpushstream.__version__}":
              raise SystemExit("Release tag must match package and SDK versions")
          PY
      - name: Check source
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src
          python -m pytest
      - name: Build distributions
        run: python -m build
      - name: Test installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pytest
          python -m xpushstream --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: distributions
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
