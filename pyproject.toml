[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xpushstream"
version = "0.1.0"
description = "Python SDK for real-time X (formerly Twitter) notifications: new posts from accounts with notifications enabled, likes on your posts, and new followers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28,<1",
    "websockets>=15,<18",
    "cryptography>=44",
    "platformdirs>=4",
]

[project.urls]
Repository = "https://github.com/tksugi/x-push-stream"
Issues = "https://github.com/tksugi/x-push-stream/issues"

[project.scripts]
xpushstream = "xpushstream.cli:main"

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.15", "pytest>=8", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xpushstream = ["py.typed"]
x_client_transaction = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: explicitly opted-in live service checks; never required in CI"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.10"
strict = true
